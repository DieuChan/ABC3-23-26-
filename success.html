<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đã gửi lời nhắn</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd1dc, #cce7ff);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .box h1 {
            color: #ff4d85;
            margin-bottom: 10px;
        }

        .box p {
            color: #555;
            margin-bottom: 20px;
        }

        .btn {
            background: #ff7aa2;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn:hover {
            background: #ff4d85;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>🎉 Gửi thành công!</h1>
    <p>Lời nhắn của bạn đã được ghi lại 💌</p>
    <a href="index.html" class="btn">Quay về trang chủ</a>
</div>

</body>
</html>
